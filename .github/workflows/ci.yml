name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore DOH_COMSS.csproj

    - name: Build Release
      run: dotnet build DOH_COMSS.csproj --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test Tests/DohCloudflare.Tests/DohCloudflare.Tests.csproj --configuration Release
